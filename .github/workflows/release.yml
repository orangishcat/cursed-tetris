name: Build and draft release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
            extension: ""
            archive_extension: .tar.gz
          - os: macos-latest
            os_name: macos
            extension: ""
            archive_extension: .tar.gz
          - os: windows-latest
            os_name: windows
            extension: .exe
            archive_extension: .zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read Cargo package metadata
        id: package
        shell: bash
        run: |
          metadata="$(cargo metadata --no-deps --format-version 1)"
          package_id="$(jq -r '.workspace_default_members[0] // .workspace_members[0]' <<< "$metadata")"
          name="$(jq -r --arg id "$package_id" '.packages[] | select(.id == $id) | .name' <<< "$metadata")"
          version="$(jq -r --arg id "$package_id" '.packages[] | select(.id == $id) | .version' <<< "$metadata")"
          test -n "$name"
          test -n "$version"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Stage binary
        id: binary
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          OS_NAME: ${{ matrix.os_name }}
          EXTENSION: ${{ matrix.extension }}
          ARCHIVE_EXTENSION: ${{ matrix.archive_extension }}
        run: |
          asset_name="${PACKAGE_NAME}-${OS_NAME}-${RUNNER_ARCH}${ARCHIVE_EXTENSION}"
          mkdir -p dist staging
          cp "target/release/${PACKAGE_NAME}${EXTENSION}" "staging/${PACKAGE_NAME}${EXTENSION}"

          if [[ "$OS_NAME" == "windows" ]]; then
            (cd staging && 7z a "../dist/${asset_name}" "${PACKAGE_NAME}${EXTENSION}")
          else
            chmod +x "staging/${PACKAGE_NAME}"
            tar -C staging -czf "dist/${asset_name}" "${PACKAGE_NAME}"
          fi

          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.binary.outputs.asset_name }}
          path: dist/${{ steps.binary.outputs.asset_name }}
          if-no-files-found: error

  release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read Cargo package metadata
        id: package
        shell: bash
        run: |
          metadata="$(cargo metadata --no-deps --format-version 1)"
          package_id="$(jq -r '.workspace_default_members[0] // .workspace_members[0]' <<< "$metadata")"
          name="$(jq -r --arg id "$package_id" '.packages[] | select(.id == $id) | .name' <<< "$metadata")"
          version="$(jq -r --arg id "$package_id" '.packages[] | select(.id == $id) | .version' <<< "$metadata")"
          test -n "$name"
          version="${version:-0.1.0}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          tag="v${PACKAGE_VERSION:-0.1.0}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --draft --title "$PACKAGE_NAME $tag"
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --draft \
              --generate-notes \
              --target "$GITHUB_SHA" \
              --title "$tag"
          fi
